# -----------------------------------------------------------------------------
# Ocular — Build WebGL and deploy to GitHub Pages
#
# REQUIRED SECRETS (Settings → Secrets → Actions):
#   UNITY_LICENSE       — contents of your Unity_lic.ulf file
#   UNITY_EMAIL         — email you log into Unity with
#   UNITY_PASSWORD      — your Unity account password
#   TRIPO_API_KEY       — your Tripo API key (tsk_...)
# -----------------------------------------------------------------------------

name: Build WebGL & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unity WebGL
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # ------------------------------------------------------------------
      # 2. Cache Unity Library
      # ------------------------------------------------------------------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # ------------------------------------------------------------------
      # 3. Generate scene
      # ------------------------------------------------------------------
      - name: Generate scene
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.25f1
          targetPlatform: WebGL
          buildMethod: Ocular.Editor.OcularSceneGenerator.GenerateBatch
          allowDirtyBuild: true

      # ------------------------------------------------------------------
      # 4. Build WebGL
      # ------------------------------------------------------------------
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.25f1
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build-output
          allowDirtyBuild: true

      # ------------------------------------------------------------------
      # 5. Fix permissions
      # ------------------------------------------------------------------
      - name: Fix build output ownership
        run: sudo chown -R $USER:$USER build-output

      - name: Show build output tree
        run: find build-output -type f | sort

      # ------------------------------------------------------------------
      # 6. Decompress .gz files so GitHub Pages can serve them.
      #    unity-builder always gzips regardless of ProjectSettings.
      #    GitHub Pages cannot set Content-Encoding: gzip headers, so the
      #    browser rejects the files. We gunzip them here and strip the
      #    .gz extension, then patch index.html to match.
      # ------------------------------------------------------------------
      - name: Decompress WebGL build files
        run: |
          BUILD_DIR="build-output/WebGL/WebGL/Build"
          if [ -d "$BUILD_DIR" ]; then
            for f in "$BUILD_DIR"/*.gz; do
              [ -f "$f" ] || continue
              gunzip -f "$f"
              echo "Decompressed: $f"
            done
          else
            echo "Build dir not found at $BUILD_DIR, trying alternate path"
            find build-output -name "*.gz" -exec gunzip -f {} \;
          fi

      - name: Patch index.html to remove .gz references
        run: |
          INDEX=$(find build-output -name "index.html" | head -1)
          if [ -f "$INDEX" ]; then
            sed -i 's/\.framework\.js\.gz/\.framework\.js/g' "$INDEX"
            sed -i 's/\.data\.gz/\.data/g' "$INDEX"
            sed -i 's/\.wasm\.gz/\.wasm/g' "$INDEX"
            sed -i 's/\.loader\.js\.gz/\.loader\.js/g' "$INDEX"
            echo "Patched $INDEX"
            grep -i "\.gz" "$INDEX" || echo "No .gz references remaining"
          else
            echo "index.html not found"
          fi

      # ------------------------------------------------------------------
      # 7. Write Tripo key + .nojekyll
      # ------------------------------------------------------------------
      - name: Write Tripo key file
        run: |
          WEBGL_DIR=$(find build-output -name "index.html" -exec dirname {} \; | head -1)
          echo "WebGL dir: $WEBGL_DIR"
          echo "${{ secrets.TRIPO_API_KEY }}" > "$WEBGL_DIR/tripo_key.txt"

      - name: Add .nojekyll
        run: |
          WEBGL_DIR=$(find build-output -name "index.html" -exec dirname {} \; | head -1)
          touch "$WEBGL_DIR/.nojekyll"

      # ------------------------------------------------------------------
      # 8. Upload artefact
      # ------------------------------------------------------------------
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: OcularWebGL
          path: build-output/WebGL/WebGL
          retention-days: 14

      # ------------------------------------------------------------------
      # 9. Deploy to GitHub Pages
      # ------------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  build-output/WebGL/WebGL
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy WebGL build from ${{ github.sha }}"
