# -----------------------------------------------------------------------------
# Ocular — Build WebGL and deploy to GitHub Pages
#
# REQUIRED SECRETS (Settings → Secrets → Actions):
#   UNITY_LICENSE       — contents of your Unity_lic.ulf file
#   UNITY_EMAIL         — email you log into Unity with
#   UNITY_PASSWORD      — your Unity account password
#   TRIPO_API_KEY       — your Tripo API key (tsk_...)
# -----------------------------------------------------------------------------

name: Build WebGL & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unity WebGL
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # ------------------------------------------------------------------
      # 2. Cache Unity Library
      # ------------------------------------------------------------------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # ------------------------------------------------------------------
      # 3. Generate scene
      # ------------------------------------------------------------------
      - name: Generate scene
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.25f1
          targetPlatform: WebGL
          buildMethod: Ocular.Editor.OcularSceneGenerator.GenerateBatch
          allowDirtyBuild: true

      # ------------------------------------------------------------------
      # 4. Build WebGL
      #    unity-builder output lands at: build-output/WebGL/WebGL/
      #      (buildsPath / targetPlatform / buildName)
      # ------------------------------------------------------------------
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.25f1
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build-output
          allowDirtyBuild: true

      # ------------------------------------------------------------------
      # 5. Fix permissions (unity-builder writes as root inside Docker)
      #    and show the output tree so we know the exact path.
      # ------------------------------------------------------------------
      - name: Fix build output ownership
        run: sudo chown -R $USER:$USER build-output

      - name: Show build output tree
        run: find build-output -type f | sort

      # ------------------------------------------------------------------
      # 6. Write Tripo key + .nojekyll into the WebGL output folder.
      #    unity-builder puts the build at build-output/WebGL/WebGL/
      # ------------------------------------------------------------------
      - name: Write Tripo key file
        run: |
          echo "${{ secrets.TRIPO_API_KEY }}" > build-output/WebGL/WebGL/tripo_key.txt

      - name: Add .nojekyll
        run: touch build-output/WebGL/WebGL/.nojekyll

      # ------------------------------------------------------------------
      # 7. Upload artefact
      # ------------------------------------------------------------------
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: OcularWebGL
          path: build-output/WebGL/WebGL
          retention-days: 14

      # ------------------------------------------------------------------
      # 8. Deploy to GitHub Pages
      # ------------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  build-output/WebGL/WebGL
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy WebGL build from ${{ github.sha }}"
