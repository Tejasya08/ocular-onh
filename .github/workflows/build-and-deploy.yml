# -----------------------------------------------------------------------------
# Ocular — Build WebGL and deploy to GitHub Pages
#
# REQUIRED SECRETS (Settings → Secrets → Actions):
#   UNITY_EMAIL         — email you log into Unity with
#   UNITY_PASSWORD      — your Unity account password
#   TRIPO_API_KEY       — your Tripo API key (tsk_...)
# -----------------------------------------------------------------------------

name: Build WebGL & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unity WebGL
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      # ------------------------------------------------------------------
      # 2. Cache Unity Library
      # ------------------------------------------------------------------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # ------------------------------------------------------------------
      # 3. Generate scene + Build WebGL via game-ci/unity-builder
      #    unity-builder pulls the right Docker image internally, so no
      #    container: block is needed and Docker-in-Docker is not required.
      #
      #    Two separate unity-builder calls:
      #      a) GenerateBatch  — builds the scene asset from code
      #      b) BuildWebGL     — produces the WebGL output
      #
      #    Both use the same image tag, resolved from ProjectVersion.txt.
      # ------------------------------------------------------------------
      - name: Generate scene
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.25f1
          targetPlatform: WebGL
          buildMethod: Ocular.Editor.OcularSceneGenerator.GenerateBatch
          buildName: OcularSim
          buildsPath: build-output
          allowDirtyBuild: true

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.25f1
          targetPlatform: WebGL
          buildMethod: Ocular.Editor.OcularBuildPipeline.BuildWebGL
          buildName: OcularSim
          buildsPath: build-output
          allowDirtyBuild: true
          customParameters: -buildOutput "${{ github.workspace }}/build-output"

      # ------------------------------------------------------------------
      # 4. Write the Tripo API key into the build output folder.
      #    Unity's TripoCredentials picks it up as tripo_key.txt at runtime.
      # ------------------------------------------------------------------
      - name: Write Tripo key file
        run: |
          mkdir -p build-output/WebGL
          echo "${{ secrets.TRIPO_API_KEY }}" > build-output/WebGL/tripo_key.txt

      # ------------------------------------------------------------------
      # 5. .nojekyll so GitHub Pages serves _framework/ correctly
      # ------------------------------------------------------------------
      - name: Add .nojekyll
        run: touch build-output/WebGL/.nojekyll

      # ------------------------------------------------------------------
      # 6. Upload artefact
      # ------------------------------------------------------------------
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: OcularWebGL
          path: build-output/WebGL
          retention-days: 14

      # ------------------------------------------------------------------
      # 7. Deploy to GitHub Pages
      # ------------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  build-output/WebGL
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy WebGL build from ${{ github.sha }}"
