# -----------------------------------------------------------------------------
# Ocular — Build WebGL and deploy to GitHub Pages
#
# Triggered on every push to main. The built WebGL output is published to the
# gh-pages branch, making the simulator available at:
#
#   https://<owner>.github.io/<repo>/
#
# and accepting eye images via:
#
#   https://<owner>.github.io/<repo>/?image=<signed-supabase-url>
#
# REQUIRED SECRETS (Settings → Secrets → Actions):
#   UNITY_LICENSE       — contents of your Unity_v6000.x.ulf licence file
#   UNITY_EMAIL         — email you log into Unity with
#   UNITY_PASSWORD      — Unity account password
#   TRIPO_API_KEY       — your Tripo API key (tsk_...) written into the build
#                         output as tripo_key.txt so the runtime can find it
#
# OPTIONAL SECRETS:
#   UNITY_SERIAL        — if you have a Plus/Pro serial-based licence instead
#                         of a personal/student one; leave empty otherwise
#
# Unity licence strategy
# ----------------------
# This workflow uses game-ci/unity-activate (Personal licence by default).
# If you have a Plus/Pro serial, set UNITY_SERIAL and the activation step
# will use it automatically.
#
# First run: generate the licence file on your local machine with:
#   "C:\Program Files\Unity\Hub\Editor\6000.0.25f1\Editor\Unity.exe"
#     -batchmode -createManualActivationFile -logFile -
# Upload the resulting .alf to https://license.unity3d.com/manual, download
# the .ulf, and store its entire contents as the UNITY_LICENSE secret.
# -----------------------------------------------------------------------------

name: Build WebGL & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow triggering manually from the Actions tab

permissions:
  contents: write           # needed to push to gh-pages

jobs:
  build:
    name: Build Unity WebGL
    runs-on: ubuntu-latest
    # Unity 6000.0.25f1 — keep in sync with ProjectSettings/ProjectVersion.txt
    container:
      image: unityci/editor:ubuntu-6000.0.25f1-webgl-3
      options: --cpus 4 --memory 12g

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout source
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false          # no LFS assets in this project

      # ------------------------------------------------------------------
      # 2. Cache the Unity Library folder.
      #    The first build after a cache miss re-imports everything (~10 min).
      #    Subsequent builds with an unchanged project skip that entirely.
      # ------------------------------------------------------------------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # ------------------------------------------------------------------
      # 3. Activate Unity licence
      # ------------------------------------------------------------------
      - name: Activate Unity (Personal)
        uses: game-ci/unity-activate@v2
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # ------------------------------------------------------------------
      # 4. Generate the simulation scene from code.
      #    Required any time CasePresets or the scene layout changes.
      #    The scene is not committed to the repo — it is always generated.
      # ------------------------------------------------------------------
      - name: Generate scene
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -quit \
            -projectPath "${{ github.workspace }}" \
            -executeMethod Ocular.Editor.OcularSceneGenerator.GenerateBatch \
            -logFile /dev/stdout
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # ------------------------------------------------------------------
      # 5. Build WebGL
      # ------------------------------------------------------------------
      - name: Build WebGL
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -quit \
            -projectPath "${{ github.workspace }}" \
            -executeMethod Ocular.Editor.OcularBuildPipeline.BuildWebGL \
            -buildOutput "${{ github.workspace }}/build-output" \
            -logFile /dev/stdout
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # ------------------------------------------------------------------
      # 6. Write the Tripo API key next to the build output.
      #    The runtime resolves keys in this order:
      #      1. TRIPO_API_KEY env var  — not available in a browser
      #      2. tripo_key.txt beside the executable  ← this step
      #      3. PlayerPrefs (typed into the app)
      #    GitHub Pages serves everything in the WebGL folder, so the key
      #    file lands at the same origin as index.html and Unity reads it
      #    via UnityWebRequest at startup.
      #
      #    NOTE: tripo_key.txt is served publicly over HTTPS. It is NOT
      #    secret from anyone who loads the page. This is the right threat
      #    model for a hosted demo (stops accidental distribution via the
      #    repo); it is NOT suitable for protecting a key from end-users.
      #    If that matters, proxy the Tripo calls server-side instead.
      # ------------------------------------------------------------------
      - name: Write Tripo key file
        if: ${{ secrets.TRIPO_API_KEY != '' }}
        run: |
          echo "${{ secrets.TRIPO_API_KEY }}" \
            > "${{ github.workspace }}/build-output/WebGL/tripo_key.txt"

      # ------------------------------------------------------------------
      # 7. Add a .nojekyll file so GitHub Pages serves the _framework and
      #    Build folders without Jekyll stripping underscore-prefixed dirs.
      # ------------------------------------------------------------------
      - name: Add .nojekyll
        run: touch "${{ github.workspace }}/build-output/WebGL/.nojekyll"

      # ------------------------------------------------------------------
      # 8. Upload the build as a workflow artefact (for inspection / download)
      # ------------------------------------------------------------------
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: OcularWebGL
          path: build-output/WebGL
          retention-days: 14

      # ------------------------------------------------------------------
      # 9. Deploy to GitHub Pages (gh-pages branch)
      # ------------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  build-output/WebGL
          publish_branch: gh-pages
          force_orphan: true        # keep gh-pages history small
          commit_message: "Deploy WebGL build from ${{ github.sha }}"
